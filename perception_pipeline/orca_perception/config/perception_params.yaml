# perception_params.yaml
# Default parameter config for the SAUVC AUV perception pipeline.
# Pass a custom path via:  ros2 launch orca_perception perception.launch.py config_file:=/path/to/params.yaml

# ── Launch-level flags (read by the launch file, not passed as ROS params) ──
launch:
  use_viz: false

# ── DNN image encoder (values forwarded as launch_arguments, not ros__parameters) ──
dnn_image_encoder:
  input_image_width: 640
  input_image_height: 640
  network_image_width: 640
  network_image_height: 640
  image_mean: "[0.0, 0.0, 0.0]"
  image_stddev: "[1.0, 1.0, 1.0]"

# ── TensorRT inference node ──────────────────────────────────────────────────
/tensor_rt:
  ros__parameters:
    model_file_path: /workspaces/isaac_ros-dev/src/best.onnx
    engine_file_path: /workspaces/isaac_ros-dev/src/best.plan
    force_engine_update: false
    output_binding_names: ["output0"]
    output_tensor_names: ["output_tensor"]
    input_tensor_names: ["input_tensor"]
    input_binding_names: ["images"]
    verbose: false

# ── YOLOv8 decoder node ──────────────────────────────────────────────────────
/yolov8_decoder_node:
  ros__parameters:
    confidence_threshold: 0.25
    nms_threshold: 0.45
    num_classes: 7

# ── Camera selector node ─────────────────────────────────────────────────────
/camera_selector_node:
  ros__parameters:
    realsense_image_topic: /orca/color/image_raw
    realsense_info_topic: /orca/color/camera_info
    usb_image_topic: /orca/usb_cam/image_raw
    usb_info_topic: /orca/usb_cam/camera_info
    mode_topic: /orca/camera_mode
    selected_image_topic: /orca/selected/image_raw
    selected_info_topic: /orca/selected/camera_info
    default_mode: realsense

# ── Depth perception node ─────────────────────────────────────────────────────
/depth_perception:
  ros__parameters:
    depth_image_topic: /orca/aligned_depth_to_color/image_raw
    detections_topic: /detections_output
    mode_topic: /orca/camera_mode
    perception_output_topic: /perception_array
    yolo_input_width: 640
    yolo_input_height: 640

# ── Depth perception viz node (only active when use_viz: true) ─────────────────
/depth_perception_viz:
  ros__parameters:
    viz_image_topic: /yolov8_processed_image
    viz_perception_topic: /perception_array
    viz_native_width: 1280
    viz_native_height: 720

# ── YOLOv8 visualizer (only active when use_viz: true) ───────────────────────
/yolov8_visualizer:
  ros__parameters:
    # Ordered list: index 0 = class 0, index 1 = class 1, etc.
    # sim model (7 classes):
    names:
      - blue_drum
      - blue_flare
      - gate
      - metal_ball
      - orange_flare
      - red_fare
      - yellow_flare
    # real model (10 classes) — uncomment and replace the list above:
    # names:
    #   - blue_drum
    #   - blue_flare
    #   - gate
    #   - gate_side
    #   - metal_ball
    #   - orange_flare
    #   - qulification_gate
    #   - red_drum
    #   - red_fare
    #   - yellow_flare
